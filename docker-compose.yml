version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: claudeprd
      POSTGRES_PASSWORD: claudeprd
      POSTGRES_DB: claudeprd
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claudeprd"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
